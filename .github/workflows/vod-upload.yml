name: Upload VOD to YouTube

on:
  # Sent by the bot when a stream ends
  repository_dispatch:
    types: [twitch-vod]
  # Manual re-runs from the Actions tab
  workflow_dispatch:
    inputs:
      vod_id:
        description: Twitch VOD ID (twitch.tv/videos/<id>)
        required: true
      title:
        description: YouTube title (defaults to the games played and date)
        required: false

jobs:
  upload:
    # Automatic uploads only run when the AUTO_VOD_UPLOAD repo variable is "true"; manual runs always do
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_VOD_UPLOAD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VOD_ID: ${{ github.event.client_payload.vod_id || inputs.vod_id }}
      VOD_TITLE: ${{ github.event.client_payload.title }}
      VOD_CREATED_AT: ${{ github.event.client_payload.created_at }}
      VOD_GAME: ${{ github.event.client_payload.game }}
      YOUTUBE_TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4

      # Long 1080p60 VODs can exceed the runner's default free disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yt-dlp google-api-python-client google-auth

      - name: Download VOD
        run: yt-dlp --concurrent-fragments 8 --write-info-json -o vod.mp4 "https://www.twitch.tv/videos/$VOD_ID"

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py vod.mp4
